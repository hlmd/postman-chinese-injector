name: build-binaries

# 打 tag（v*）时构建全平台单文件二进制并作为 Release 资产上传；
# 也可在 Actions 页手动触发（workflow_dispatch）只产出构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许 action-gh-release 创建 Release / 上传资产
      id-token: write          # attest-build-provenance 需要 OIDC 令牌
      attestations: write      # 写入构建来源证明（build provenance）
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Build embeddable data (zh-CN)
        run: node scripts/build-data.js

      - name: Cross-compile all targets
        run: |
          set -e
          mkdir -p dist
          build() { bun build ./postman-chinese-injector.js --compile --minify --target="bun-$1" --outfile "dist/$2"; }
          build windows-x64  postman-chinese-injector-win-x64.exe
          build linux-x64     postman-chinese-injector-linux-x64
          build linux-arm64   postman-chinese-injector-linux-arm64
          build darwin-x64    postman-chinese-injector-macos-x64
          build darwin-arm64  postman-chinese-injector-macos-arm64
          ls -la dist

      # 老 Windows（Win8.1 / Server 2012 R2+）专用：bun 产物静态链接 ConPTY，在 Win10 1809 以下
      # 无法加载（Issue #4）。改用 pkg（Node 运行时，动态探测 ConPTY）跨平台打 node16-win-x64。
      - name: Build legacy Windows binary (pkg / Node runtime)
        run: |
          set -e
          node scripts/build-bin-legacy.js
          ls -la dist

      - name: Compress binaries (复用 scripts/compress-dist.js，并行 zip / tar.xz)
        run: |
          set -e
          # tar.xz 里保留可执行位（bun 产物一般已是 0755，这里兜底）
          chmod +x dist/postman-chinese-injector-linux-x64 \
                   dist/postman-chinese-injector-linux-arm64 \
                   dist/postman-chinese-injector-macos-x64 \
                   dist/postman-chinese-injector-macos-arm64
          # 与本地同一脚本：各文件并行压缩（Windows→zip，其余→tar.xz）
          node scripts/compress-dist.js
          # 脚本默认保留原始二进制（便于本地测试）；CI 只发布压缩包，删掉生二进制
          rm -f dist/postman-chinese-injector-win-x64.exe \
                dist/postman-chinese-injector-win-x64-legacy.exe \
                dist/postman-chinese-injector-linux-x64 \
                dist/postman-chinese-injector-linux-arm64 \
                dist/postman-chinese-injector-macos-x64 \
                dist/postman-chinese-injector-macos-arm64
          ls -la dist

      - name: Build browser extension (zip)
        run: |
          set -e
          node scripts/build-extension.js          # 简繁合一，扩展内切换

      # 供用户核对下载到的文件与 CI 产物一致（缓解杀软误报时的信任问题，见 README「杀毒软件报毒」）
      - name: Generate SHA256SUMS.txt
        run: |
          set -e
          cd dist
          sha256sum postman-chinese-injector-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 证明这些发行包确实由本仓库的公开工作流从公开源码构建：
      #   gh attestation verify <文件> --repo <owner>/<repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # 证明失败不应毁掉整次发版：该步骤在上传之前，报错会中断 job 导致产物发不出去
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/postman-chinese-injector-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-chinese-injector-binaries
          path: dist/*

      # 本次更新简介：取 tag 注解正文（git tag -a vX.Y.Z -m "..."）拼在固定说明前面，
      # 让每个 Release 的描述都写清这一版改了什么；没有注解时只留固定说明。
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          # checkout 只取了单个 ref，补一次以确保能读到注解对象
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          : > release-notes.md
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            {
              printf '## 本次更新\n\n'
              printf '%s\n' "$notes"
              printf '\n---\n\n'
            } >> release-notes.md
          fi
          cat >> release-notes.md <<'RELEASE_BODY'
          把中文翻译注入 Postman 的非官方第三方工具。

          - **桌面端**：下载对应平台的压缩包（Windows 为 `.zip`，Linux/macOS 为 `.tar.xz`），
            解压得到单文件后，完全退出 Postman 再运行即可注入；`restore` 命令还原，`-h` 看全部命令。
            按系统语言自动选简体 / 繁體，也可用 `--lang zh-CN` / `--lang zh-TW` 指定。
            （macOS/Linux 解压后如丢失执行权限：`chmod +x <文件名>`）
          - **老 Windows**（Win8.1 / Server 2012 R2+，默认版报 `ClosePseudoConsole` 错时）：
            下载 `postman-chinese-injector-win-x64-legacy.zip`（Node 运行时打包）。
          - **网页版**：下载 `postman-chinese-injector-extension.zip`，解压后在 Chrome/Edge 用
            「加载已解压的扩展程序」加载；默认跟随浏览器语言，点扩展图标可指定简体 / 繁體。

          详见 README。交流反馈 QQ 群：494969115。

          **完整性校验**：`SHA256SUMS.txt` 为本次构建的校验和；所有发行包均由 GitHub Actions
          从公开源码构建并附带来源证明，可用
          `gh attestation verify <文件> --repo ${{ github.repository }}` 验证。

          > 🛡️ **杀毒软件报毒？** 单文件二进制（bun / pkg 打包）被启发式误判是行业通病，非真实威胁。
          > 原因、核实办法与「直接跑源码」的替代方案见 README 的
          > [杀毒软件报毒（误报）说明](https://github.com/${{ github.repository }}#杀毒软件报毒误报说明)。

          ---
          ⚠️ **法律声明**：本项目为社区维护的非官方工具，**与 Postman, Inc. 无任何关联**，
          未获其授权、赞助或背书；"Postman" 是 Postman, Inc. 的商标。本仓库与发行包**不含、
          也不分发** Postman 的任何源代码 / 二进制 / 原始语言包——仅有本项目自己的脚本与社区编写的
          中文译文。本工具在你**自己的机器**上修改你**自己安装**的 Postman，是否使用由你自行决定
          并承担风险，请遵守 Postman 的服务条款与 EULA。代码以 MIT 许可发布（不覆盖派生自 Postman
          文案的译文数据）。本说明不构成法律意见。
          RELEASE_BODY
          cat release-notes.md

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 仅上传二进制与扩展 zip（+ 校验和），不上传 dist/extension 解包目录
          files: |
            dist/postman-chinese-injector-*
            dist/SHA256SUMS.txt
          body_path: release-notes.md

  # 发版后同步到包管理器：npm、Scoop bucket（hlmd/scoop-bucket）、Homebrew tap（hlmd/homebrew-tap）。
  # 各步骤相互独立、缺少对应密钥时自动跳过，不影响 Release 本身。
  #   NPM_TOKEN         npm 自动化令牌（已在 npmjs.com 配置 Trusted Publishing 时可不设）
  #   PACKAGING_TOKEN  对 hlmd/scoop-bucket 与 hlmd/homebrew-tap 有 Contents 写权限的 PAT
  publish-packages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # npm provenance / Trusted Publishing 需要 OIDC
    env:
      HAS_PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24     # 自带 npm 11，支持 Trusted Publishing
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: ver
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$pkg" ]; then
            echo "::warning::tag v$tag 与 package.json 版本 $pkg 不一致，跳过 npm 发布"
            echo "npm=false" >> "$GITHUB_OUTPUT"
          elif npm view "postman-chinese-injector@$tag" version >/dev/null 2>&1; then
            echo "npm 上已存在 $tag，跳过 npm 发布"
            echo "npm=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.ver.outputs.npm == 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Download SHA256SUMS.txt
        if: env.HAS_PACKAGING_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          name: postman-chinese-injector-binaries
          path: dist

      - name: Checkout Scoop bucket
        if: env.HAS_PACKAGING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: hlmd/scoop-bucket
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: scoop-bucket

      - name: Checkout Homebrew tap
        if: env.HAS_PACKAGING_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: hlmd/homebrew-tap
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: homebrew-tap

      - name: Update Scoop / Homebrew manifests
        if: env.HAS_PACKAGING_TOKEN == 'true'
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          node scripts/update-pkg-manifests.js --version "$v" --sums dist/SHA256SUMS.txt \
            --scoop scoop-bucket --brew homebrew-tap
          for repo in scoop-bucket homebrew-tap; do
            (
              cd "$repo"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              if git diff --cached --quiet; then
                echo "$repo 无变化"
              else
                git commit -m "postman-chinese-injector: 更新到 v$v"
                git push
              fi
            )
          done
